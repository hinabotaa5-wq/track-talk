services:
  - type: web
    name: track-talk-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: API_ADDR
        value: :8080
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
  - type: cron
    name: track-talk-major-hosts
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    schedule: "0 0 1 4,10 *"
    dockerCommand: /app/importmajors
    envVars:
      - key: DATABASE_URL
        sync: false
  - type: cron
    name: track-talk-competitions
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    schedule: "0 21 * * *"
    dockerCommand: /app/importcompetitions
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
