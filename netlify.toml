[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"
  # Git の push（マージ）では作らない。本番に出すときは Actions の「Deploy Web」がビルドフックで呼ぶ。
  # ビルドフックからのビルドはこの ignore を通らない（Netlify の仕様）。
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"
  # 現在はコーチ募集のみ。利用者向け画面は準備中の案内にする。
  NEXT_PUBLIC_COACHING_ENABLED = "0"
  # 有料の1対1のやりとり。電気通信事業の届出が受理されるまで "0" のまま
  NEXT_PUBLIC_COACHING_MESSAGING_ENABLED = "0"
  # 動画添削のあとの追加相談（一方通行・1つの添削につき1回）の送信。開けるのは運営者の指示があってから
  NEXT_PUBLIC_COACHING_CONSULTATION_ENABLED = "0"
  # コーチ一覧（/coaches とコーチの詳細）の公開。コーチングを開けても "0" の間は一覧だけ準備中にする。開けるのは運営者の指示があってから
  NEXT_PUBLIC_COACHING_COACH_LIST_ENABLED = "0"

[context.production.environment]
  # ブラウザに配布する公開プロジェクトキー。管理用の秘密鍵ではない。
  NEXT_PUBLIC_POSTHOG_KEY = "phc_rRHpSCdA2jSgQuTnAUMTGPWbd2No24S4vdU25RMFGwmA"
  NEXT_PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"
  # 登録・ログインの自動操作対策(Cloudflare Turnstile)の公開用の鍵。秘密の鍵は Supabase にだけ入れる。
  # これで確認の枠が出るのを確かめてから、Supabase の CAPTCHA を有効にする(docs/account-security.md)。
  NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFn-wwNGiE8fdc4e"

[[plugins]]
  package = "@netlify/plugin-nextjs"
