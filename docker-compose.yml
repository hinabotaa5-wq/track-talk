services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracktalk
      POSTGRES_PASSWORD: tracktalk
      POSTGRES_DB: tracktalk
    ports:
      # 開発用。ホスト側に別の Postgres が 5432 を使っていても衝突しないよう 55432 にし、外には公開しない
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracktalk -d tracktalk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
