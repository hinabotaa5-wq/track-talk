services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracktalk
      POSTGRES_PASSWORD: tracktalk
      POSTGRES_DB: tracktalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracktalk -d tracktalk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
