# Cloud Run の API に入れる環境変数。env.yaml にコピーして値を入れ、setup.sh に渡す。
# env.yaml は Git にコミットしない（.gitignore 済み）。値は Supabase・Cloudinary の画面や、前に使っていたサービスの環境変数から写す。
DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
SUPABASE_JWT_SECRET: ""
SUPABASE_JWT_AUD: "authenticated"
SUPABASE_SERVICE_ROLE_KEY: ""
# 画面の本番 URL。Vercel と Netlify を並行で使う間はカンマ区切りで両方書く
CORS_ORIGINS: "https://YOUR_SITE.vercel.app"
CLOUDINARY_CLOUD_NAME: ""
CLOUDINARY_API_KEY: ""
CLOUDINARY_API_SECRET: ""
# Web Push（フォーム添削の通知）。npx web-push generate-vapid-keys などで作る
VAPID_PUBLIC_KEY: ""
VAPID_PRIVATE_KEY: ""
VAPID_SUBJECT: "mailto:"
# フォーム添削の tick を呼ぶ秘密の値。deploy/cloud-run/coaching-tick.sh が作って入れるので、ここは空でよい
COACHING_TICK_SECRET: ""
# パーソナル指導の支払い（Stripe）。秘密鍵が空のあいだは支払いなしのデモ版。
# Webhook は Stripe のダッシュボードで https://API の URL/webhooks/stripe に
# checkout.session.completed と checkout.session.async_payment_succeeded を送るように作り、その署名の秘密（whsec_）を入れる
STRIPE_SECRET_KEY: ""
STRIPE_WEBHOOK_SECRET: ""
# 支払い画面から戻ってくる画面の URL。空なら CORS_ORIGINS の最初のもの
WEB_BASE_URL: ""
LOG_LEVEL: "info"
