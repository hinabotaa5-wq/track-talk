# Cloud Run の API に入れる環境変数。env.yaml にコピーして値を入れ、setup.sh に渡す。
# env.yaml は Git にコミットしない（.gitignore 済み）。値は Supabase・Cloudinary の画面や、前に使っていたサービスの環境変数から写す。
DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
SUPABASE_JWT_SECRET: ""
SUPABASE_JWT_AUD: "authenticated"
SUPABASE_SERVICE_ROLE_KEY: ""
# 画面の本番 URL（Netlify のサイト URL。末尾の / なし）
CORS_ORIGINS: "https://YOUR_SITE.netlify.app"
CLOUDINARY_CLOUD_NAME: ""
CLOUDINARY_API_KEY: ""
CLOUDINARY_API_SECRET: ""
CLOUDINARY_AUTH_TOKEN_KEY: ""
# Web Push（フォーム添削の通知）。npx web-push generate-vapid-keys などで作る
VAPID_PUBLIC_KEY: ""
VAPID_PRIVATE_KEY: ""
VAPID_SUBJECT: "mailto:"
# オンラインコーチングの API と画面（保護者の同意、パーソナル指導、フォーム添削、コーチの報酬と送金）。
# 提供を始めるまで空のままにする（空なら API は 404、画面は Not Found）
COACHING_ENABLED: ""
# 新規申込・チケット購入・追加相談の受付。停止時も既存対応のため COACHING_ENABLED は維持する
COACHING_NEW_ACCEPTANCE_ENABLED: ""
# フォーム添削の tick を呼ぶ秘密の値。deploy/cloud-run/coaching-tick.sh が作って入れるので、ここは空でよい
COACHING_TICK_SECRET: ""
# 月1回の記録のお知らせを呼ぶ秘密の値。deploy/cloud-run/monthly-reminder.sh が作って入れるので、ここは空でよい
REMINDER_SECRET: ""
# 保存期限の毎日の整理(/internal/storage/cleanup)を呼ぶ秘密の値。deploy/cloud-run/storage-cleanup.sh が作って入れるので、ここは空でよい
STORAGE_CLEANUP_SECRET: ""
# 感覚メモの1週間のまとめ（AI）。本人が頼んだときだけ感覚メモを Gemini に送る。
# 空なら API は 404。Web の NEXT_PUBLIC_SENSE_SUMMARY_ENABLED と揃える
SENSE_SUMMARY_ENABLED: ""
# 管理者・承認済みコーチの API に二段階認証(aal2)を求める。全員が /me/security で設定し終えてから 1 にする
STAFF_MFA_REQUIRED: ""
# 大会の取り込みと同じ Gemini の API キー。空ならまとめは作れない（503）。
# 無料枠は送った内容が Google の改善に使われることがあるので、利用者が感覚メモを書く前に有料枠のキーにする
GEMINI_API_KEY: ""
# まとめに使うモデル。空なら gemini-3.5-flash-lite(軽くて安く、無料枠の回数を大会の取り込みと分け合わない)
GEMINI_SUMMARY_MODEL: ""
# 全員のAPI試行上限。成功・失敗とも数え、直近24時間200回・直近1分5回。
# 未設定でもこの値が既定。0を明示した場合だけ、その窓の上限を無効にする。
# Tier 0 の Flash-Lite（確認時500回/日・15回/分）に余裕を残す。
SENSE_SUMMARY_DAILY_LIMIT: "200"
SENSE_SUMMARY_MINUTE_LIMIT: "5"
# パーソナル指導・フォーム添削の支払いと、コーチへの送金（Stripe、送金は Connect）。秘密鍵が空のあいだは支払いなしのデモ版。
# コーチへの送金を使うには、Stripe のダッシュボードで Connect を有効にしておく。
# Webhook は Stripe のダッシュボードで https://API の URL/webhooks/stripe に
# checkout.session.completed と checkout.session.async_payment_succeeded と charge.dispute.created（チャージバックを運営に知らせる）を送るように作り、その署名の秘密（whsec_）を入れる
STRIPE_SECRET_KEY: ""
STRIPE_WEBHOOK_SECRET: ""
# コーチのアカウントの変化（account.updated）を受ける接続アカウント用の送り先を作ったときだけ。同じ URL でよいが鍵は別
STRIPE_CONNECT_WEBHOOK_SECRET: ""
# Stripe の API のバージョンを固定したいときだけ（空ならアカウントの既定）。Webhook 側のバージョンはダッシュボードで決まる
STRIPE_API_VERSION: ""
# 秘密鍵を入れるなら STRIPE_WEBHOOK_SECRET も要る（入れ忘れると API が起動しない）。本番の鍵（sk_live_ / rk_live_）のときは、
# WEB_BASE_URL（空なら CORS_ORIGINS の最初のもの）が https:// で、COACHING_TICK_SECRET も入っている必要がある
# 支払い画面から戻ってくる画面の URL。空なら CORS_ORIGINS の最初のもの
WEB_BASE_URL: ""
LOG_LEVEL: "info"
# 保護者の同意のリンクを送るメール。独自ドメインなしで無料で送るなら Gmail の SMTP(アプリパスワードを使う)。
# 空のあいだは、リンクを出せない。Resend を使う場合は RESEND_API_KEY を入れ、SMTP_* は空のままにする
SMTP_HOST: "smtp.gmail.com"
SMTP_PORT: "465"
SMTP_USER: ""
SMTP_PASSWORD: ""
MAIL_FROM: "TrackTalk <your-address@gmail.com>"
