name: Imports

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 0 1 4,10 *"
    # 国内主要大会は日程の発表を早く拾えるよう毎月取り込む
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: 実行する取り込み
        type: choice
        options:
          - competitions
          - major-hosts
          - domestic-majors
        default: competitions

# リポジトリは読むだけ。GITHUB_TOKEN に書き込みの権限を持たせない。
permissions:
  contents: read

concurrency:
  group: imports-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  competitions:
    if: github.event.schedule == '0 21 * * *' || inputs.job == 'competitions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Import competitions
        working-directory: apps/api
        run: go run ./cmd/importcompetitions

  major-hosts:
    if: github.event.schedule == '0 0 1 4,10 *' || inputs.job == 'major-hosts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Import major hosts
        working-directory: apps/api
        run: go run ./cmd/importmajors

  domestic-majors:
    if: github.event.schedule == '0 0 1 * *' || inputs.job == 'domestic-majors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Import domestic majors
        working-directory: apps/api
        run: go run ./cmd/importdomestic
