name: Imports

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 0 1 4,10 *"
  workflow_dispatch:
    inputs:
      job:
        description: 実行する取り込み
        type: choice
        options:
          - competitions
          - major-hosts
        default: competitions

concurrency:
  group: imports-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  competitions:
    if: github.event.schedule == '0 21 * * *' || inputs.job == 'competitions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: Import competitions
        working-directory: apps/api
        run: go run ./cmd/importcompetitions

  major-hosts:
    if: github.event.schedule == '0 0 1 4,10 *' || inputs.job == 'major-hosts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: Import major hosts
        working-directory: apps/api
        run: go run ./cmd/importmajors
