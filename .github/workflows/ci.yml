name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

# リポジトリは読むだけ。GITHUB_TOKEN に書き込みの権限を持たせない。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracktalk
          POSTGRES_PASSWORD: tracktalk
          POSTGRES_DB: tracktalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracktalk -d tracktalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tracktalk:tracktalk@localhost:5432/tracktalk?sslmode=disable
      SUPABASE_JWT_SECRET: test-jwt-secret-for-ci-only
      SUPABASE_JWT_AUD: authenticated
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracktalk
          POSTGRES_PASSWORD: tracktalk
          POSTGRES_DB: tracktalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracktalk -d tracktalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tracktalk:tracktalk@localhost:5432/tracktalk?sslmode=disable
      SUPABASE_JWT_SECRET: test-jwt-secret-for-ci-only
      SUPABASE_JWT_AUD: authenticated
      SUPABASE_URL: ""
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Install browser
        timeout-minutes: 5
        working-directory: apps/web
        run: |
          # Azure側のミラーが低速な場合も、検証環境の準備を長時間待たない。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Login to post
        working-directory: apps/web
        run: |
          node e2e/auth-stub.mjs &
          (cd ../api && go run ./cmd/api) &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health
          curl -sf -o /dev/null -X POST http://127.0.0.1:54321/auth/v1/token
          npx playwright test e2e/home.spec.ts e2e/login-post.spec.ts e2e/ui-improvements.spec.ts e2e/post-layout.spec.ts e2e/home-feed-performance.spec.ts e2e/last-tab-startup.spec.ts e2e/startup-responsive.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: login-post-e2e
          path: apps/web/test-results
