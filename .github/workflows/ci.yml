name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracktalk
          POSTGRES_PASSWORD: tracktalk
          POSTGRES_DB: tracktalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracktalk -d tracktalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tracktalk:tracktalk@localhost:5432/tracktalk?sslmode=disable
      SUPABASE_JWT_SECRET: test-jwt-secret-for-ci-only
      SUPABASE_JWT_AUD: authenticated
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
