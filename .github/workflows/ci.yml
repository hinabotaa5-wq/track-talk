name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

# リポジトリは読むだけ。GITHUB_TOKEN に書き込みの権限を持たせない(Dependabot の自動マージのジョブだけ例外)。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracktalk
          POSTGRES_PASSWORD: tracktalk
          POSTGRES_DB: tracktalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracktalk -d tracktalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tracktalk:tracktalk@localhost:5432/tracktalk?sslmode=disable
      SUPABASE_JWT_SECRET: test-jwt-secret-for-ci-only
      SUPABASE_JWT_AUD: authenticated
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test
        working-directory: apps/api
        run: go test ./...
      - name: Check Go vulnerabilities
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracktalk
          POSTGRES_PASSWORD: tracktalk
          POSTGRES_DB: tracktalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracktalk -d tracktalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tracktalk:tracktalk@localhost:5432/tracktalk?sslmode=disable
      SUPABASE_JWT_SECRET: test-jwt-secret-for-ci-only
      SUPABASE_JWT_AUD: authenticated
      SUPABASE_URL: ""
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Install browser
        timeout-minutes: 5
        working-directory: apps/web
        run: |
          # Azure側のミラーが低速な場合も、検証環境の準備を長時間待たない。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Login to post
        working-directory: apps/web
        run: |
          node e2e/auth-stub.mjs &
          (cd ../api && go run ./cmd/api) &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health
          curl -sf -o /dev/null -X POST http://127.0.0.1:54321/auth/v1/token
          npx playwright test e2e/home.spec.ts e2e/login-post.spec.ts e2e/ui-improvements.spec.ts e2e/post-layout.spec.ts e2e/home-feed-performance.spec.ts e2e/last-tab-startup.spec.ts e2e/startup-responsive.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: login-post-e2e
          path: apps/web/test-results

  # Dependabot の更新 PR は、上のテストがすべて通ったら自動でマージし、変わった側(API か Web)だけを本番に出す。
  # 大きな変更が入りうるメジャー更新(1.x → 2.x など)だけは人が見る。
  # Web の本番デプロイは1回ごとに Netlify のクレジットを使うので、更新は dependabot.yml で月1回にまとめている。
  dependabot-merge:
    needs: [api, web, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
      # GitHub Actions の部品だけの更新は、本番の中身が変わらないので出さない。
      - name: Deploy API
        if: steps.meta.outputs.update-type != 'version-update:semver-major' && (steps.meta.outputs.package-ecosystem == 'go_modules' || (steps.meta.outputs.package-ecosystem == 'docker' && contains(steps.meta.outputs.directory, 'apps/api')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-api.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Deploy Web
        if: steps.meta.outputs.update-type != 'version-update:semver-major' && steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml --ref main --repo "$GITHUB_REPOSITORY"
