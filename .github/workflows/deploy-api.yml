name: Deploy API

# Cloud Run（東京）へ API を送る。マージしても自動では動かず、Actions の画面の Run workflow で手動で流す。
# 初回の作成と環境変数の登録は deploy/cloud-run/setup.sh で行い、ここではイメージだけを差し替える。
# 下の GCP_* は秘密ではない（鍵ではなく、どのプロジェクトに送るかの指定）。プロジェクトを変えたら書き換える。
on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: refined-bolt-493709-a8
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/274141774717/locations/global/workloadIdentityPools/github/providers/github
      GCP_SERVICE_ACCOUNT: github-deploy@refined-bolt-493709-a8.iam.gserviceaccount.com
      REGION: asia-northeast1
      IMAGE: asia-northeast1-docker.pkg.dev/refined-bolt-493709-a8/track-talk/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" apps/api
          docker push "$IMAGE"
      # 予算超過で API を止める budget-stop も同じイメージなので、古いイメージが掃除されても動くよう一緒に差し替える。
      - name: Deploy
        run: |
          gcloud run deploy track-talk-api --image "$IMAGE" --region "$REGION" --project "$GCP_PROJECT_ID" --quiet
          STOPPER_URL=$(gcloud run services describe track-talk-budget-stop --region "$REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')
          test -n "$STOPPER_URL"
          gcloud run deploy track-talk-budget-stop --invoker-iam-check --no-allow-unauthenticated --update-env-vars "PUSH_AUDIENCE=$STOPPER_URL,PUSH_SERVICE_ACCOUNT=budget-stop@$GCP_PROJECT_ID.iam.gserviceaccount.com" --image "$IMAGE" --command /app/budgetstop --region "$REGION" --project "$GCP_PROJECT_ID" --quiet
