name: Configure Coaching Availability

# 募集のみ／コーチング公開を明示的に切り替える。Web側のフラグも合わせること。
# この操作では新規の申し込み・購入を常に停止する。受付開始は別途判断する。
on:
  workflow_dispatch:
    inputs:
      enabled:
        description: コーチング利用を公開する（falseはコーチ募集のみ）
        type: boolean
        default: false
        required: true

concurrency:
  group: configure-coaching
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: refined-bolt-493709-a8
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/274141774717/locations/global/workloadIdentityPools/github/providers/github
      GCP_SERVICE_ACCOUNT: github-deploy@refined-bolt-493709-a8.iam.gserviceaccount.com
      REGION: asia-northeast1
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Configure coaching availability
        env:
          COACHING_SCREEN_FLAG: ${{ inputs.enabled && '1' || '0' }}
        run: |
          gcloud run services update track-talk-api \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID" \
            --update-env-vars "COACHING_ENABLED=$COACHING_SCREEN_FLAG,COACHING_NEW_ACCEPTANCE_ENABLED=0" \
            --quiet
