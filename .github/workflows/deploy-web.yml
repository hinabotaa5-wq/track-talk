name: Deploy Web

# 画面を本番に出す。マージしても自動では出ないので、Actions の画面の Run workflow で手動で流す。
# 送り先はリポジトリの Secrets に登録した Netlify のビルドフックの URL。
#   NETLIFY_BUILD_HOOK: Netlify の Site configuration → Build & deploy → Build hooks で作った URL
on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call deploy hook
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK を Secrets に登録してください"
            exit 1
          fi
          curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}?trigger_title=github-actions"
          echo "Netlify のビルドを始めました"
