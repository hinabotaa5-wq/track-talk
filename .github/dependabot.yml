# 使っているライブラリに既知の脆弱性が見つかったり、古くなったりしたときに、更新の PR を自動で作る。
# PR が増えすぎないよう、月1回・種類ごとに1本にまとめる。マージしても自動では本番に出ない。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    # Node は 22 で動かしているので、型定義は 22 のまま。TypeScript は Next.js が対応してから上げる。
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web"]
    schedule:
      interval: monthly
    # Node のメジャーは、Netlify のビルドの版とあわせて手で上げる。
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
