<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>メールアドレスの確認</title>
  <style>
    :root { color-scheme: light only; }
    @media (prefers-color-scheme: dark) {
      .bg { background-color: #f3f6fb !important; }
      .card { background-color: #ffffff !important; }
      .brand { color: #1d4ed8 !important; }
      .title, .body { color: #18181b !important; }
      .muted { color: #71717a !important; }
      .foot { color: #a1a1aa !important; }
      .btn { background-color: #2563eb !important; }
      .btn a { color: #ffffff !important; }
    }
  </style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#f3f6fb;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">下のボタンを押すと、登録が完了します。</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="bg" bgcolor="#f3f6fb" style="background-color:#f3f6fb;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="card" bgcolor="#ffffff" style="max-width:480px;background-color:#ffffff;border-radius:16px;">
          <tr>
            <td style="padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;">
              <p class="brand" style="margin:0 0 28px;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#1d4ed8;">TRACK TALK</p>
              <h1 class="title" style="margin:0 0 12px;font-size:22px;line-height:1.4;font-weight:700;color:#18181b;">メールアドレスの確認</h1>
              <p class="body" style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#3f3f46;">下のボタンを押すと、登録が完了します。</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="btn" align="center" bgcolor="#2563eb" style="border-radius:10px;background-color:#2563eb;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">メールアドレスを確認する</a>
                  </td>
                </tr>
              </table>
              <p class="muted" style="margin:28px 0 8px;font-size:12px;line-height:1.6;color:#71717a;">ボタンが開けないときは、このリンクをブラウザに貼り付けてください。</p>
              <p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#1d4ed8;">{{ .ConfirmationURL }}</a></p>
              <p class="foot" style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#a1a1aa;">心当たりがなければ、このメールは破棄してください。<br><a href="{{ .SiteURL }}" class="foot" style="color:#a1a1aa;text-decoration:none;">{{ .SiteURL }}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
